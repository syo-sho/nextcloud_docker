name: ImagesCrate

# 显式声明权限，允许工作流向 GitHub Container Registry (GHCR) 写入镜像
permissions:
  contents: read    # 允许拉取代码
  packages: write   # 允许创建和推送容器镜像

on:
  pull_request:
  workflow_run:
    workflows: ["update.sh"]
    branches: [master]
    types:
      - completed

defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'

jobs:

  init:
    name: Detect Latest Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - id: detect
        name: Detect latest Nextcloud version directory
        run: |
          latest="$(ls -1d [0-9]* | sort -n | tail -1)"
          echo "version=$latest" >> "$GITHUB_OUTPUT"
          echo "Detected latest version: $latest"

  build:
    needs: init
    runs-on: ubuntu-latest
    name: Build fpm-alpine (amd64 only)

    steps:
      - uses: actions/checkout@v6

      - name: Build amd64 image
        run: |
          cd "${{ needs.init.outputs.version }}/fpm-alpine"
          docker build --platform linux/amd64 \
            -t ghcr.io/${{ github.actor }}/nextcloud_docker:${{ needs.init.outputs.version }}-fpm-alpine \
            -t ghcr.io/${{ github.actor }}/nextcloud_docker:fpm-alpine \
            .

      - name: Push image
        if: github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${{ github.actor }}/nextcloud_docker:${{ needs.init.outputs.version }}-fpm-alpine
          docker push ghcr.io/${{ github.actor }}/nextcloud_docker:fpm-alpine

  summary:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    name: images-test-summary

    steps:
      - name: Summary status
        run: |
          if [ "${{ needs.build.result }}" != "success" ] && [ "${{ needs.build.result }}" != "skipped" ]; then
            echo "Build job failed!"
            exit 1
          fi
