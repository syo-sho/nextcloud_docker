name: Images

permissions: {}

on:
  pull_request:
  workflow_run:
    workflows: ["update.sh"]
    branches: [master]
    types:
      - completed

defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'

jobs:

  init:
    name: Detect Latest Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - id: detect
        name: Detect latest Nextcloud version directory
        run: |
          latest="$(ls -1d [0-9]* | sort -n | tail -1)"
          echo "version=$latest" >> "$GITHUB_OUTPUT"
          echo "Detected latest version: $latest"

  build:
    needs: init
    runs-on: ubuntu-latest
    name: Build fpm-alpine (amd64 only)

    steps:
      - uses: actions/checkout@v6

      - name: Prepare build context
        run: |
          cd "${{ needs.init.outputs.version }}/fpm-alpine"
          cp Dockerfile-alpine.template Dockerfile

      - name: Build amd64 image
        run: |
          cd "${{ needs.init.outputs.version }}/fpm-alpine"
          docker build --platform linux/amd64 -t ghcr.io/${{ github.repository }}:fpm-alpine .

      - name: Push image
        if: github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${{ github.repository }}:fpm-alpine

  summary:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    name: images-test-summary

    steps:
      - name: Summary status
        run: if ${{ needs.build.result != 'success' && needs.build.result != 'skipped' }}; then exit 1; fi
